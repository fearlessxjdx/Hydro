name: Sync with upstream repository

on:
  schedule:
    - cron: "0 5 * * *" # UTC 每天5点执行（可改频率）
  workflow_dispatch: # 允许手动点按钮立即运行

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 给token写入权限
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master # 你的主分支
          token: ${{ secrets.GH_PAT }}

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and rebase upstream master branch
        run: |
          git remote add upstream https://github.com/hydro-dev/Hydro.git
          # git tag -l | xargs git tag -d    # 清空本地所有标签，保证只保留上游的标签
          git fetch upstream --tags
          git rebase upstream/master

      - name: Push origin master branch (force)
        run: git push -f origin master

      - name: Push tags to origin (full sync)
        run: |
          git push origin --tags --force --prune
